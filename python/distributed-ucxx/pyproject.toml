[project.urls]
Homepage = "https://github.com/ROCm-DS/hip-ucxx"

[tool.coverage.run]
disable_warnings = [
    "include-ignored",
]
include = [
    "distributed_ucxx/*",
]
omit = [
    "distributed_ucxx/tests/*",
]

[tool.isort]
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
order_by_type = true
known_dask = [
    "dask",
    "distributed",
]
known_rapids = [
    "rmm",
    "cudf",
    "ucxx",
]
known_first_party = [
    "distributed_ucxx",
]
default_section = "THIRDPARTY"
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "DASK",
    "RAPIDS",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
skip = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "__init__.py",
]

# >>>>>>> END NEW CODE (480d7d8e)
[tool.setuptools.packages.find]
exclude = [
    "docs",
    "tests",
    "docs.*",
    "tests.*",
]

[tool.setuptools.package-data]
"distributed_ucxx" = ["VERSION", "*.yaml"]

[tool.setuptools.dynamic]
version = {file = "distributed_ucxx/VERSION"}

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI hard limit is 1GiB, but try to keep these as small as possible
max_allowed_size_compressed = '10Mi'

[tool.pytest.ini_options]
markers = [
    "ignore_alive_references",
    "gpu",
    "slow",
]
